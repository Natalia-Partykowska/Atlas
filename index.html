<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/globe.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas — Explore the world's data through an interactive 3D globe." />
    <title>Atlas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      First-load splash. Static HTML/CSS on purpose: globe setup blocks the main
      thread in 0.5–1.5 s long tasks, so anything JS-driven (timers, React, SMIL,
      offset-path) freezes. Only transform/opacity animations on HTML elements run
      on the compositor and keep moving. Dismissed by dismissSplash()
      (src/lib/splash.ts) once the globe's countries have painted.

      The mark mirrors BrandStrip.tsx's 28-unit logo (orbit rx 12 / ry 4 tilted
      -22deg, planet r 3, satellite r 1.6) — keep the two in sync.
    -->
    <style>
      html { background: #080B12; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080B12;
        transition: opacity 700ms ease 150ms;
      }
      #splash[data-state="out"] { opacity: 0; pointer-events: none; }

      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .splash-logo {
        --u: calc(88px / 28);
        position: relative;
        width: calc(28 * var(--u));
        height: calc(28 * var(--u));
        transition: opacity 300ms ease, transform 300ms ease;
      }
      #splash[data-state="out"] .splash-logo { opacity: 0; transform: scale(0.92); }

      .splash-logo svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Orbit rig: an ellipse is a circle squashed then tilted, so the satellite
         rides a plain rotation inside a static rotate(-22deg) scaleY(1/3) frame.
         The dot counter-rotates and un-squashes so it stays round. 14deg is where
         the dot sits in the static logo, so frame 0 matches BrandStrip. */
      .splash-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        transform: rotate(-22deg) scaleY(0.33333);
      }
      .splash-spin {
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        transform: rotate(14deg);
        animation: splash-spin 2.4s linear infinite;
      }
      .splash-sat {
        position: absolute;
        left: calc(10.4 * var(--u));
        top: calc(-1.6 * var(--u));
        width: calc(3.2 * var(--u));
        height: calc(3.2 * var(--u));
        border-radius: 50%;
        background: #E6E7E7;
        transform: rotate(-14deg) scaleY(3);
        animation: splash-sat 2.4s linear infinite;
      }
      @keyframes splash-spin {
        from { transform: rotate(14deg); }
        to { transform: rotate(374deg); }
      }
      @keyframes splash-sat {
        from { transform: rotate(-14deg) scaleY(3); }
        to { transform: rotate(-374deg) scaleY(3); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-spin, .splash-sat { animation: none; }
        #splash[data-state="out"] .splash-logo { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status">
      <span class="splash-sr">Loading Atlas…</span>
      <div class="splash-logo" aria-hidden="true">
        <!-- Back: orbit + planet. Planet is opaque (the colour 81% white blends
             to on #080B12) so the front occluder below doesn't double-blend. -->
        <svg viewBox="0 0 28 28" fill="none">
          <ellipse cx="14" cy="14" rx="12" ry="4" stroke="#FFFFFF" stroke-opacity="0.63" stroke-width="1.5" transform="rotate(-22 14 14)" />
          <circle cx="14" cy="14" r="3" fill="#D0D1D2" />
        </svg>
        <div class="splash-orbit">
          <div class="splash-spin">
            <div class="splash-sat"></div>
          </div>
        </div>
        <!-- Front: the planet's far half, drawn over the satellite so it passes
             behind the planet on the far side of the orbit and in front on the
             near side. -->
        <svg viewBox="0 0 28 28" fill="none">
          <defs>
            <clipPath id="splash-far-half">
              <rect x="0" y="0" width="28" height="14" />
            </clipPath>
          </defs>
          <g transform="rotate(-22 14 14)">
            <circle cx="14" cy="14" r="3" fill="#D0D1D2" clip-path="url(#splash-far-half)" />
          </g>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
